[package]
name = "rabe-bn"
version = "0.5.0"
edition = "2024"
authors = [
  "Sean Bowe <ewillbefull@gmail.com>",
  "Bramm, Georg <georg.bramm@aisec.fraunhofer.de>",
]
description = "Pairing cryptography with the Barreto-Naehrig curve. Update to use latest rand and serde crates."
keywords = ["pairing", "crypto", "cryptography"]
readme = "README.md"
repository = "https://github.com/georgbramm/rabe-bn"
documentation = "https://docs.rs/rabe-bn"
license = "MIT OR Apache-2.0"
exclude = ["rabe-bn.iml", "/.idea"]

[features]
default = ["serde"]
borsh = ["borsh/derive"]
serde = ["serde/derive"]

[dependencies]
borsh = { version = "1.5.0", optional = true, default-features = false }
byteorder = "1.5.0"
rand = "0.8.5"
serde = { version = "1.0", optional = true, default-features = false }

[dev-dependencies]
serde_json = "1.0.151"

# This previously hid cases of bugs, so it should be carefully considered and checked before
# removal to ensure there is not silent overflow occurring
[profile.release]
debug-assertions = true
